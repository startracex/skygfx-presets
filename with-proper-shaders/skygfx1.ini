[SkyGfx]
keySwitch=0x79
keyReload=0x7A

; Keep SkyGfx's brighter PS2 texture modulation off so the image stays
; closer to configuration 1 without its excessive brightness.
ps2Modulate=0
dualPass=1

;; Proper Shaders owns these pipelines. Keep both entries disabled.
;buildingPipe=PS2
;vehiclePipe=Env
detailMaps=1
stochasticTexturing=1
envMapSize=256
envMapFarClipMult=1.0
leedsShininessMult=1.0
neoShininessMult=1.0
neoSpecularityMult=1.0
envShininessMult=1.0
envSpecularityMult=1.0
envPower=10.0
envFresnel=0.7
sunGlare=0

grassAddAmbient=1
grassFixPlacement=1
grassBackfaceCull=0

; Prevent SkyGfx from drawing a second set of character/vehicle shadows.
pedShadows=0
stencilShadows=0

; Leave the colour filter unset to retain configuration 1's colour character.
colorFilter=PS2
rgb1Mult=0.90
rgb2Mult=1.0
blurLeft=0
blurTop=0
blurRight=0
blurBottom=0

doRadiosity=0
radiosity=Shader
vcsTrails=0
trailsLimit=80
trailsIntensity=15
trailsResolution=1

disableClouds=0
disableGamma=1
neoWaterDrops=1
neoBloodDrops=0
transparentLockon=1
lightningIlluminatesWorld=1
fixPcCarLight=1
coronaZtest=0
fixShadows=0

; Keep the tag override disabled as well, so Proper Shaders remains in control.
; tagsBuildingPipe=Xbox
ps2ModulateGrass=1
zwriteThreshold=200
zwriteThresholdPed=100
